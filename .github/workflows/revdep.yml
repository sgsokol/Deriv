name: Revdep Check

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  revdep:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies & revdepcheck
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            r-lib/revdepcheck

      - name: Run revdep check
        run: |
          revdepcheck::revdep_check(bioc = FALSE, num_workers = parallel::detectCores())
        shell: Rscript {0}

      - name: Upload revdep check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revdep-results
          path: revdep/
